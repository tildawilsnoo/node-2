<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wiki Animator</title>

  <link rel="stylesheet" type="text/css" href="style.css">

  <script src="libraries/p5.min.js"></script>
</head>

<body>
  <script src="sketch.js"></script>
  <div id="label">
    <div id="date-time">
      <div id="date"></div>
      <div id="time"></div>
      <a id="wiki-link" target="_blank">view on wiki</a>
      <div id="live-duration"></div>
    </div>
    <div id="editor-block">
      <div id="edit-label"><span class="field-label">Username:</span><div id="editor"></div></div>
      <div id="comment-label"><span class="field-label">Comment:</span><div id="comment"></div></div>
    </div>
    <div id="jump-block">
      <label for="jump-input">Jump to rev:</label>
      <input id="jump-input" type="text" placeholder="rev id" />
      <span id="jump-msg"></span>
    </div>
    <div id="filter-block">
      <span class="field-label">Filter by tag:</span>
      <div id="filter-tags"></div>
    </div>
  </div>
  <div id="timeline"></div>
  <div id="text"></div>
  <div id="references"></div>



</body>

</html>
